<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FacturaFlow - Sistema de Facturación Digital e Inventario con React y Bootstrap sobre Microservicios en Go" />
  <title>FacturaFlow | Gestión Comercial y Facturación en React + Bootstrap</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3.3 CSS (CDN sin atributo integrity frágil) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Sistema de Estilos y Paleta de Colores FacturaFlow (Autocontenido) -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Contenedor Principal de la Aplicación -->
  <div id="root">
    <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 bg-friendly-surface p-3">
      <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Iniciando aplicación...</span>
      </div>
      <h4 class="fw-bold text-primary mb-1">FacturaFlow</h4>
      <p class="text-secondary small mb-0">Cargando componentes React 18 y estilos Bootstrap...</p>
    </div>
  </div>

  <!-- React 18 & ReactDOM 18 (Producción UMD) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone para transpilar JSX en el cliente sin conflicto -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Capa Base de Configuración y Cliente HTTP -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>

  <!-- Bundle Unificado de React (Evita condiciones de carrera XHR de Babel) -->
  <script type="text/babel" src="js/app.bundle.jsx"></script>

  <!-- Control de contingencia visual en caso de demora de red -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('[FacturaFlow Error]', e);
      var rootEl = document.getElementById('root');
      if (rootEl && !rootEl.querySelector('.app-layout') && !rootEl.querySelector('.auth-split-wrapper')) {
        rootEl.innerHTML = '<div class="container py-5 text-center">' +
          '<div class="friendly-card p-4 mx-auto shadow-lg" style="max-width: 520px;">' +
          '<h4 class="fw-bold text-danger mb-2">Aviso de Inicialización</h4>' +
          '<p class="text-secondary small mb-3">Si tu conexión es lenta o estás fuera de línea, puedes reintentar la conexión con los microservicios.</p>' +
          '<button class="btn btn-primary" onclick="window.location.reload()">Reintentar Carga</button>' +
          '</div></div>';
      }
    });
  </script>
</body>
</html>
